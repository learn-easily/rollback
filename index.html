/* ================= WAVES, STORY & PHASES ================= */
function pendingBoss(){for(const a of[1,2,3])if(K.mdone['m-part'+a]&&!K.story.comp[a])return PARTS[a].boss;return null}
function buildWave(n){
  let c=8+4*n+Math.floor(.25*n*n);
  if(n<=2){let power=4+level()*2;for(const b of S.builds.values())power+=BDEF[b.type].dmg?6:b.type==='wall'?b.lvl:0;c=Math.round(c*clamp(power/(c*.5),.75,1))}   // gentle start only
  if(S.finale===2)c=Math.round(c*1.4);
  const mix=[['sprinter',n>=2?.2:0],['drone',n>=5?.15:0],['shield',n>=6?.12:0],['jugg',n>=7?.07:0],['hacker',n>=8?.08:0]];
  const q=[];for(const[k,p]of mix){let m=Math.round(c*p);if(k==='jugg'&&n>=7)m=Math.max(1,m);for(let i=0;i<m;i++)q.push(k)}
  while(q.length<c)q.push('crawler');shuffle(q);
  const pb=pendingBoss();
  if(pb&&n-S.bossLast>=2){q.splice(Math.floor(q.length*.6),0,pb);S.bossLast=n}
  else if((K.story.ending&&n%5===0)||S.finale===2)q.splice(Math.floor(q.length*.6),0,['nullref','ioor','stack'][Math.floor(Math.random()*3)]);
  return q;
}
function spawnBot(k){
  const D=RK[k],s=SOCKETS[S.sides[S.sideI++%S.sides.length]];let x=s.x+.5,y=s.y+.5;
  for(let t=0;t<8;t++){const ox=s.y===1||s.y===62?(Math.random()*6-3):0,oy=s.x===1||s.x===62?(Math.random()*6-3):0;const tx=Math.floor(s.x+ox),ty=Math.floor(s.y+oy);if(inb(tx,ty)&&!S.res.has(idx(tx,ty))){x=tx+.5;y=ty+.5;break}}
  const hp=Math.round(30*(1+.1*S.night)*D.hp);
  S.bots.push(mkBot(k,x,y,hp));
  if(!K.seenZ[k]&&D.info){K.seenZ[k]=1;saveK();toast(`New: ${D.name}. ${D.info}`,8)}
  else if(D.boss)toast(`${D.name} is here.`,3);
}
function setPhase(p){
  S.phase=p;S.t=0;
  if(p==='dusk'){
    const n=Math.min(4,1+Math.floor((S.night-1)/3));S.sides=shuffle([0,1,2,3]).slice(0,n);
    const pb=pendingBoss(),bossTonight=(pb&&S.night-S.bossLast>=2)||S.finale===1;
    toast(`Dusk. The robots come from the ${S.sides.map(i=>SOCKETS[i].name).join(' and ')}.${bossTonight&&pb?` ${RK[pb].name} is coming tonight. ${BOSS_LINE[pb]}`:''}`,6);SFX.dusk();
    closeTerm();if(modal==='armory')hideModal();
  }
  if(p==='night'){
    if(S.finale===1)S.finale=2;
    S.queue=buildWave(S.night);S.total=S.queue.length;S.spawnT=0;S.sideI=0;S.stats=newStats();S.clearT=0;closeTerm();if(mode)setMode(null);
    toast(S.finale===2?'The machine is charging. Hold the Server until dawn!':`Night ${S.night}: ${S.total} robots. T = quick command repairs and reboots the base.`,4);
  }
  if(p==='dawn'){
    for(const z of S.bots)parts(z.x,z.y-.5,6,'#F2C14E',{up:-2,g:-2});
    S.bots.length=0;S.shots.length=0;S.shells.length=0;timeScale=1;SFX.dawn();closeQuick();
    if(S.finale===2){S.finale=3;showFinale()}else showDawn();
  }
  renderPalette();
}
function update(dt){
  S.t+=dt;
  if(S.phase==='day'&&S.t>=LEN.day)setPhase('dusk');
  else if(S.phase==='dusk'&&S.t>=LEN.dusk)setPhase('night');
  else if(S.phase==='night'){
    if(S.queue.length){S.spawnT-=dt;if(S.spawnT<=0){spawnBot(S.queue.shift());S.spawnT=SPAWN_WINDOW/S.total;if(Math.random()<.15)SFX.servo()}}
    else if(!S.bots.length&&S.finale!==2){S.clearT+=dt;if(S.clearT>2.5){setPhase('dawn');return}}
    if(S.t>=LEN.night){setPhase('dawn');return}
  }
  updHero(dt);
  for(const z of S.bots)if(!z.dead)updBot(z,dt);separate();
  for(const a of S.animals)updAnimal(a,dt);S.animals=S.animals.filter(a=>!a.dead);
  for(const b of[...S.builds.values()])updBuild(b,dt);
  for(const p of S.shots){
    p.px=p.x;p.py=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.src==='hero'&&S.res.has(idx(Math.floor(p.x),Math.floor(p.y+.45)))&&S.res.get(idx(Math.floor(p.x),Math.floor(p.y+.45))).type!=='bush'){p.life=0;continue}
    shotHits(p);
  }
  S.shots=S.shots.filter(p=>p.life>0);
  for(const s of S.shells){s.t+=dt;if(s.t>=s.dur){s.done=1;explode(s)}}
  S.shells=S.shells.filter(s=>!s.done);
  S.bots=S.bots.filter(z=>!z.dead);
  for(const o of S.res.values())if(o.sh>0)o.sh-=dt;
  if(S.server.flash>0)S.server.flash-=dt;
  if(S.quickCd>0)S.quickCd-=dt;
  if(S.combo.t>0)S.combo.t-=dt;
  if(S.server.hp<=0){S.server.hp=0;gameOver()}
}
function updFx(dt){
  for(const p of S.parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  S.parts=S.parts.filter(p=>p.life>0);
  for(const f of S.floats){f.y-=dt*.9;f.life-=dt}
  S.floats=S.floats.filter(f=>f.life>0);
  for(const b of S.bolts)b.life-=dt;S.bolts=S.bolts.filter(b=>b.life>0);
  for(const r of S.rings){r.life-=dt;r.r+=dt*5}S.rings=S.rings.filter(r=>r.life>0);
  if(S.marker){S.marker.t-=dt;if(S.marker.t<=0)S.marker=null}
  S.shake=Math.max(0,S.shake-dt);
  if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').style.opacity=0}
}

/* ================= RENDER ================= */
function darkness(){
  const{phase,t}=S;
  if(phase==='day')return t>LEN.day-25?(t-(LEN.day-25))/25*.25:0;
  if(phase==='dusk')return .25+t/LEN.dusk*.5;
  if(phase==='night')return t>LEN.night-10?.75-(t-(LEN.night-10))/10*.4:.75;
  return .3;
}
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function bar(x,y,w,v,c){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x-w/2,y,w,3.5);ctx.fillStyle=c;ctx.fillRect(x-w/2,y,w*clamp(v,0,1),3.5)}
const SHADOW='rgba(24,40,28,.28)';
function drawTree(o,x,y){
  const px=x*T,py=y*T,s=o.sh>0?Math.sin(o.sh*60)*2:0;

  if(o.hp<o.max)bar(px+16,py-14,22,o.hp/o.max,'#E2B27A');
}
function drawRock(o,x,y){

function echoSays(){

  if(!K.owned.pick1)return bpOwned('pick1')?'Buy the stone pickaxe in the Armory (I). Then mine stone and robot wrecks.':'Mission “Stone Age” gives you a pickaxe. Stone and scrap need it.';
  for(const a of[1,2,3]){
    const pm=MISSIONS.find(m=>m.part===a);
    if(St.parts[a])continue;
    if(S.server.lvl<a)break;
    if(St.comp[a])return`You have the ${PARTS[a].name} component. Click the Server to install it.`;
    if(K.mdone[pm.id])return`${RK[PARTS[a].boss].name} carries the ${PARTS[a].name}. It attacks at night. ${BOSS_LINE[PARTS[a].boss]}`;
    if(missionOpen(pm))return`I can trace the ${PARTS[a].name} now. Play mission “${pm.title}”.`;
    return`Finish ${pm.req-actDone(a)} more act ${a} mission${pm.req-actDone(a)>1?'s':''} and I can trace the ${PARTS[a].name}.`;
  }
  const nx=S.server.lvl+1;
  if(EXAMS[nx]&&(!EXAMS[nx].part||St.parts[EXAMS[nx].part])&&nx<=4)return K.exams[nx]?`Exam passed. Click the Server and upgrade it to level ${nx}.`:`The Server can reach level ${nx}. Click it and take the exam.`;
  if(St.parts[1]&&St.parts[2]&&St.parts[3]&&!St.ending)return S.machine?'The machine is built. Survive the charging night.':'All three parts are installed. Click the Server and build the time machine.';
  const buy=Object.keys(ITEMS).find(k=>ITEMS[k].price&&bpReady(k)&&!K.owned[k]);

/* ---- quick command (night) ---- */
let qc=null;
function openQuick(){
  if(qc||S.quickCd>0||S.phase!=='night')return;
  const pool=BANK.filter(x=>x.chapter<=maxCh()&&x.tier!=='gold'&&(!x.code||x.code.length<90)&&!recent.includes(x.id));
  const c=pool[Math.floor(Math.random()*pool.length)];recent.push(c.id);if(recent.length>6)recent.shift();
  qc={c,t:8,answered:null,order:shuffle([...c.options.keys()])};
  $('#quick').hidden=false;renderQuick();
}
function renderQuick(){
  let h=questionHtml(qc);
  if(qc.answered!=null)h+=`<div class="fb ${qc.ok?'good':'bad'}"><b>${qc.ok?'Base repaired, turrets rebooted.':qc.answered===-1?'Time is up.':'Not quite.'}</b><span>${esc(qc.c.explain)}</span></div>`;
  $('#qBody').innerHTML=h;
}
function answerQuick(oi){
  if(!qc||qc.answered!=null)return;qc.answered=oi;
  if(oi>=0){qc.ok=grade(qc.c,oi,false).ok}else{qc.ok=false;if(!K.review.find(r=>r.id===qc.c.id))K.review.push({id:qc.c.id,stage:0,due:S.night+1});saveK();SFX.wrong()}
  if(qc.ok){for(const b of S.builds.values()){b.hp=Math.min(b.max,b.hp+b.max*.25);b.off=0;parts(b.x+.5,b.y+.3,4,'#7FC8B8',{up:-2,g:-1})}S.server.hp=Math.min(S.server.max,S.server.hp+20)}
  S.quickCd=20;renderQuick();const ref=qc;setTimeout(()=>{if(qc===ref)closeQuick()},qc.ok?1600:3400);
}
function closeQuick(){qc=null;$('#quick').hidden=true}
$('#qBody').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)answerQuick(+o.dataset.o)});

  for(const b of S.builds.values())b.kills=0;
}
function startNextDay(){
  S.night++;S.hero.down=false;S.hero.hp=heroMax();S.hero.act=null;S.hero.food=Math.max(S.hero.food,20);
  if(heroBlocked(S.hero.x,S.hero.y)){S.hero.x=SX+1;S.hero.y=SY+2.7}
  S.server.hp=Math.min(S.server.max,S.server.hp+S.server.max*.05);
  for(const b of S.builds.values())if(b.type==='farm'){if(b.water&&b.crop>0&&b.crop<3)b.crop++;b.water=0}
  for(const sp of S.builds.values())if(sp.type==='sprinkler')for(const b of S.builds.values())if(b.type==='farm'&&b.crop>0&&b.crop<3&&Math.hypot(b.x-sp.x,b.y-sp.y)<=4)b.water=1;
  for(const o of S.res.values())if(o.type==='bush')o.hp=o.max;
  const r=Math.random;ensure('tree',18,14,r);ensure('rock',7,14,r);ensure('wreck',10,26,r,12);ensure('bush',8,16,r,7);
  for(let k=0;k<10;k++){const x=2+Math.floor(r()*60),y=2+Math.floor(r()*60);if(!isPath(x,y)&&Math.hypot(x-31.5,y-31.5)>14&&!S.res.has(idx(x,y))&&!S.builds.has(idx(x,y)))addRes(idx(x,y),'tree',r)}
  if(S.animals.length<12)spawnAnimals(12-S.animals.length);
  S.today=newToday();
  flow();setPhase('day');saveRun();hideModal();toast(`Day ${S.night}. Learn, gather, eat, build.`);
}
function gameOver(){
  if(modal==='over')return;
  K.record=Math.max(K.record,S.night);saveK();store.del(RKEY);closeTerm();closeQuick();
  showModal('over',`<h2>The robots took the Server on night ${S.night}.</h2>
  <p class="lead">Record: night ${K.record}.</p>
  <p><b style="color:var(--teal)">Echo:</b> “I backed myself up just in time.” Your missions, blueprints, gear, passed exams, time machine parts and rank ${rank()} are safe. The base, the Server level and your resources are gone.</p>
  <div class="row"><button class="primary" id="mNew">New run</button></div>`);
}
function showKnowledge(){
  const topicRow=t=>{const m=mastery(K.hist[t]);return`<div class="topic"><span>${TOPICS[t].name}</span><div class="track"><i style="width:${m}%;background:${m>=80?'var(--ok)':'var(--teal)'}"></i></div><em>${m}%</em></div>`};
  const ch=CHAPTERS.map(c=>{const un=c.n<=maxCh(),m=mastery(K.chHist[c.n]);const ms=MISSIONS.filter(x=>x.lvl===c.n),dn=ms.filter(x=>K.mdone[x.id]).length;
    return`<div class="chap ${un?'':'locked'}"><div class="hd"><b>${c.act} · ${c.name}</b><small>${un?`${dn} of ${ms.length} missions done`:`Server level ${c.n}`}</small></div>
    ${Object.keys(TOPICS).filter(t=>TOPICS[t].ch===c.n).map(topicRow).join('')}
    <div class="topic"><span><b style="color:var(--fg)">Chapter mastery</b></span><div class="track"><i style="width:${m}%;background:var(--gold)"></i></div><em>${m}%</em></div></div>`}).join('');
  const due=K.review.filter(r=>r.due<=S.night).length,St=K.story;
  const found=LOGS.map((l,i)=>St.logs[i]?`<button data-log="${i}">Log ${i+1}</button>`:'').join('');
  showModal('know',`<h2>Knowledge</h2>
  <p>${rank()} · level ${level()} · ${K.xp} XP · ${K.total.n} questions answered${K.total.n?`, ${Math.round(K.total.ok/K.total.n*100)}% correct`:''}. Mastery is the share of correct answers among the last 10 in a topic.</p>
  <div class="parts">${[1,2,3].map(a=>`<div class="${St.parts[a]?'on':''}">${PARTS[a].name}<small>${St.parts[a]?'installed':St.comp[a]?'component found':K.mdone['m-part'+a]?`carried by ${RK[PARTS[a].boss].name}`:'not found yet'}</small></div>`).join('')}</div>
  ${ch}
  <p>Review queue: ${K.review.length} question${K.review.length===1?'':'s'}, ${due} due now.</p>
  <span class="sect">Dev logs found · ${Object.keys(St.logs).length} of ${LOGS.length}</span><div class="row">${found||'<p>None yet. Look for glowing notes around the map.</p>'}</div>
  <div class="later">${LATER.map(l=>`<span>${l}</span>`).join('')}</div>
  <div class="row"><button class="primary" id="mClose">Back to the base <kbd>Esc</kbd></button></div>`);
}
$('#mBox').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;ac();
  if(b.dataset.s){storyNext(b.dataset.s==='skip');return}
  if(b.dataset.f!=null){const v=b.dataset.f;if(v==='go'){if(fin.i<FINALE.length-1){fin.i++;fin.ans=null;fin.order=shuffle([0,1,2,3]);renderFinale()}else{K.story.ending=1;S.machine=0;S.finale=0;K.xp+=500;saveK();SFX.win();showStory('ending',()=>{showDawn()})}}else{fin.ans=+v;fin.ans===0?SFX.right():SFX.wrong();renderFinale()}return}
  if(b.dataset.log){showLog(+b.dataset.log);return}
  if(b.dataset.t){atab=b.dataset.t;showArmory();return}
  if(b.dataset.buy){const k=b.dataset.buy,it=ITEMS[k];if(!canPay(it.price))return;pay(it.price);K.owned[k]=1;if(it.slot==='weapon'||it.slot==='armor')K.eq[it.slot]=k;saveK();SFX.coin();toast(`${it.name} bought${it.slot==='weapon'||it.slot==='armor'?' and equipped':''}.`);showArmory();return}
  if(b.dataset.eq){K.eq[ITEMS[b.dataset.eq].slot]=b.dataset.eq;saveK();SFX.build();showArmory();return}
  const id=b.id;
  if(id==='mCont'){try{loadRun(store.get(RKEY))}catch(err){newRun()}begin()}
  if(id==='mNew'){newRun();if(!K.story.intro){K.story.intro=1;saveK();showStory('intro',begin)}else begin()}
  if(id==='mDay')startNextDay();
  if(id==='mClose')hideModal();
});
function begin(){
  hideModal();started=true;timeScale=1;cam.x=S.hero.x;cam.y=S.hero.y;mode=null;palSig='';renderPalette();
  toast(K.bp.wall1?`Day ${S.night}. Learn, gather, eat, build.`:'Press T and start mission “First Commit”. Click trees to chop wood.',6);
}

/* ================= INPUT ================= */
addEventListener('keydown',e=>{
  if(!S)return;
  if(modal){
    if(modal==='story'&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();storyNext(false);return}
    if(modal==='finale'&&/^Digit[1-4]$/.test(e.code)&&fin.ans!==0){$('#mBox').querySelectorAll('.opt')[+e.code.slice(5)-1]?.click();return}
    if(e.code==='Escape'&&(modal==='know'||modal==='armory'||modal==='log'))hideModal();
    if(e.code==='KeyI'&&modal==='armory')hideModal();
    if(e.code==='Enter'&&modal==='dawn')startNextDay();
    return;
  }
  if(qc&&qc.answered==null&&/^Digit[1-4]$/.test(e.code)){const k=+e.code.slice(5)-1;if(qc.order[k]!=null)answerQuick(qc.order[k]);e.preventDefault();return}
  if(termOpen){
    if(/^Digit[1-4]$/.test(e.code)&&cur&&cur.answered==null&&run){const k=+e.code.slice(5)-1;if(cur.order[k]!=null)answerTerm(cur.order[k]);e.preventDefault();return}
    if(e.code==='Enter'){termEnter();e.preventDefault();return}
    if(e.code==='Escape'||e.code==='KeyT'){closeTerm();e.preventDefault();return}
    if(S.phase!=='night')return;
  }
  keys[e.code]=true;
  if(/^Digit[1-9]$/.test(e.code)){const n=+e.code.slice(5);const ready=PAL.filter(p=>bpReady(p.key));if(ready[n-1])setMode(ready[n-1].key);return}
  switch(e.code){
    case'KeyX':setMode('demolish');break;
    case'KeyT':openTerm();break;
    case'KeyF':eat();break;
    case'KeyI':showArmory();break;
    case'KeyK':case'Tab':e.preventDefault();showKnowledge();break;
    case'KeyN':if(S.phase==='day')setPhase('dusk');break;
    case'Escape':if(mode)setMode(null);else if(S.sel)select(null);break;
    case'Equal':case'NumpadAdd':zoomT=clamp(zoomT*1.2,.55,1.9);break;
    case'Minus':case'NumpadSubtract':zoomT=clamp(zoomT/1.2,.55,1.9);break;
  }
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const lastPtr={x:0,y:0};
function toWorld(mx,my){const z=T*zoom;return{x:(mx-W/2)/z+cam.x,y:(my-H/2)/z+cam.y}}
function botAt(wx,wy){let best=null,bd=.8;for(const z of S.bots){if(!visibleBot(z))continue;const d=Math.hypot(z.x-wx,z.y-.45*z.sc-(RK[z.k].fly?.45:0)-wy)/z.sc;if(d<bd){bd=d;best=z}}return best}
function animalAt(wx,wy){let best=null,bd=.7;for(const a of S.animals){const d=Math.hypot(a.x-wx,a.y-.3-wy);if(d<bd){bd=d;best=a}}return best}
const touches=new Map();let pinch=null,pendingTap=null;
function tapAt(cx,cy){
  if(!S||S.hero.down)return;
  const w=toWorld(cx,cy),t={x:Math.floor(w.x),y:Math.floor(w.y)};
  const z=botAt(w.x,w.y);if(z){cmdAttack(z,false);return}
  const an=animalAt(w.x,w.y);if(an){cmdAttack(an,true);return}
  if(!inb(t.x,t.y))return;
  if(isServer(t.x,t.y)){select({server:1});return}
  const i=idx(t.x,t.y);
  if(S.res.has(i)){select(null);cmdGather(t.x,t.y);return}
  if(S.builds.has(i)){select({i});return}
  select(null);cmdMove(t.x,t.y);
}
cv.addEventListener('pointerdown',e=>{
  ac();if(!S||modal)return;lastPtr.x=e.clientX;lastPtr.y=e.clientY;
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){const[a,b]=[...touches.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:zoomT};pendingTap=null;drag=null;return}
    if(touches.size>2)return;
  }
  if(e.button===2){if(mode)setMode(null);else select(null);return}
  const w=toWorld(e.clientX,e.clientY),t={x:Math.floor(w.x),y:Math.floor(w.y)};hover=t;
  if(mode==='demolish'){if(S.builds.has(idx(t.x,t.y)))demolish(t.x,t.y);return}
  if(mode){const p=PAL.find(q=>q.key===mode);if(p&&p.line&&bpReady('batch')){drag={a:t,b:t};try{cv.setPointerCapture(e.pointerId)}catch(err){}}else tryBuild([[t.x,t.y]]);return}
  if(e.pointerType==='touch'){pendingTap={id:e.pointerId,x:e.clientX,y:e.clientY};return}
  tapAt(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{
  if(!S)return;
  if(e.pointerType==='touch'&&touches.has(e.pointerId)){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&touches.size>=2){const[a,b]=[...touches.values()];zoomT=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,.55,1.9);return}
    if(pendingTap&&e.pointerId===pendingTap.id&&Math.hypot(e.clientX-pendingTap.x,e.clientY-pendingTap.y)>14)pendingTap=null;
  }
  lastPtr.x=e.clientX;lastPtr.y=e.clientY;
  const w=toWorld(e.clientX,e.clientY);hover={x:Math.floor(w.x),y:Math.floor(w.y)};
  if(drag)drag.b=hover;
  if(e.pointerType!=='touch'){if(!mode){const i=inb(hover.x,hover.y)?idx(hover.x,hover.y):-1;cv.style.cursor=botAt(w.x,w.y)||animalAt(w.x,w.y)?'crosshair':i>=0&&(S.res.has(i)||S.builds.has(i)||isServer(hover.x,hover.y))?'pointer':'default'}else cv.style.cursor='crosshair'}
});
cv.addEventListener('pointerup',e=>{
  touches.delete(e.pointerId);
  if(pinch){if(touches.size<2)pinch=null;return}
  if(pendingTap&&pendingTap.id===e.pointerId){const p=pendingTap;pendingTap=null;tapAt(p.x,p.y);return}
  if(drag){tryBuild(lineTiles(drag.a,drag.b));drag=null}
});
cv.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);pinch=null;pendingTap=null;drag=null});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();zoomT=clamp(zoomT*(e.deltaY<0?1.15:1/1.15),.55,1.9)},{passive:false});
$('#palette').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ac();setMode(b.dataset.k)});
$('#bTerm').addEventListener('click',()=>{ac();termOpen?closeTerm():openTerm()});
$('#bEat').addEventListener('click',()=>{ac();eat()});
$('#bArm').addEventListener('click',()=>{ac();showArmory()});
$('#bKnow').addEventListener('click',()=>{ac();showKnowledge()});
$('#bSkip').addEventListener('click',()=>{if(S&&S.phase==='day')setPhase('dusk')});
function toggleSound(){muted=!muted;$('#bSound').textContent=muted?'Sound off':'Sound on';store.set('survivecs.mute',muted)}
$('#bSound').addEventListener('click',()=>{ac();toggleSound()});
muted=!!store.get('survivecs.mute');$('#bSound').textContent=muted?'Sound off':'Sound on';

/* ================= LOOP ================= */
let acc=0,last=performance.now(),hudT=0,miniT=0,speed=1;
const paused=()=>!started||!!modal||(termOpen&&S.phase!=='night');
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(S&&!paused()){acc+=dt*timeScale*speed;let k=0;while(acc>=STEP&&k++<2400){update(STEP);acc-=STEP;if(modal)break}}else acc=0;
  if(S){
    if(!paused())updFx(dt);else if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').style.opacity=0}
    zoom+=(zoomT-zoom)*Math.min(1,dt*8);
    const k=Math.min(1,dt*7);cam.x+=(S.hero.x-cam.x)*k;cam.y+=(S.hero.y-.5-cam.y)*k;
    if(qc&&qc.answered==null&&!paused()){qc.t-=dt;$('#qBar').style.width=(qc.t/8*100)+'%';$('#qTime').textContent=Math.ceil(qc.t)+'s';if(qc.t<=0)answerQuick(-1)}
    if(termOpen&&$('#lockS')){if(now>=lockUntil){lockUntil=0;renderTerm()}else $('#lockS').textContent=Math.ceil((lockUntil-now)/1000)}
    if((hudT-=dt)<=0){hudT=.15;updateHud();renderPalette()}
    if((miniT-=dt)<=0){miniT=.25;if(!compactQ.matches)drawMini()}
  }
  render(now);
  requestAnimationFrame(frame);
}
if(location.hash==='#test'){window.__G={S:()=>S,K:()=>K,setSpeed:v=>{speed=v},begin:()=>{if(!started){newRun();begin()}},step:(n)=>{for(let i=0;i<n;i++)if(S.phase!=='dawn'&&modal==null)update(STEP)},modal:()=>modal,startNextDay,eat,fight:()=>{const h=S.hero;if(h.act&&h.act.kind==='attack'&&!h.act.e.dead)return;let best=null,bd=1e9;for(const z of S.bots){if(RK[z.k].fly&&weapon().w.melee)continue;const d=distServer(z.x,z.y)*2+Math.hypot(z.x-h.x,z.y-h.y);if(d<bd){bd=d;best=z}}if(best)cmdAttack(best,false)}}}
const saved=store.get(RKEY);
if(saved){try{loadRun(saved)}catch(e){S=null}}
if(!S){S=baseState(1234);genWorld(1234);drawFloor();flow()}
cam.x=S.hero.x;cam.y=S.hero.y;renderPalette();updateHud();
showStart();
requestAnimationFrame(frame);
})();
</script>
